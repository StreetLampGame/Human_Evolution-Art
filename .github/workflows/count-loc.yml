name: Count Lines of Code
run-name: "LOC: ${{ inputs.branch || 'latest' }} (${{ inputs.target_path }})"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch for LOC count (leave empty for latest active branch)'
        required: false
        type: string
      target_path:
        description: 'Folder path to count LOC (leave as . for whole repo)'
        required: true
        default: '.'
        type: string

jobs:
  count-lines:
    runs-on: ubuntu-latest
    steps:
      - name: Free up runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Analyze Unity (Latest), Git (All Repo), and LOC (Input Branch)
        run: |
          sudo apt-get update --fix-missing && sudo apt-get install -y --fix-missing cloc jq || (sleep 5 && sudo apt-get update && sudo apt-get install -y cloc jq)
          git fetch --all --tags --quiet

          LATEST_BRANCH=$(git for-each-ref --sort=-committerdate refs/remotes/origin/ --format='%(refname:short)' | grep -v 'origin/HEAD' | head -n 1 | sed 's|^origin/||')
          LOC_BRANCH="${{ inputs.branch }}"
          if [ -z "$LOC_BRANCH" ]; then
            LOC_BRANCH="$LATEST_BRANCH"
          fi

          echo "## Summary Overview" >> $GITHUB_STEP_SUMMARY
          echo "- **Unity Stats Source Branch (Latest):** **$LATEST_BRANCH**" >> $GITHUB_STEP_SUMMARY
          echo "- **LOC Source Branch (Input):** **$LOC_BRANCH**" >> $GITHUB_STEP_SUMMARY
          echo "- **LOC Target Path:** **${{ inputs.target_path }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 1. Unity Stats from LATEST_BRANCH
          git checkout "$LATEST_BRANCH" --quiet
          echo "### Unity Project Info (from $LATEST_BRANCH)" >> $GITHUB_STEP_SUMMARY
          PV_FILE=$(find . -maxdepth 4 -path "*/ProjectSettings/ProjectVersion.txt" | head -n 1)
          if [ -n "$PV_FILE" ]; then
            UNITY_VER=$(grep "m_EditorVersion:" "$PV_FILE" | awk '{print $2}')
            echo "- **Unity Version:** **$UNITY_VER**" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Unity Version:** Not detected" >> $GITHUB_STEP_SUMMARY
          fi

          # 2. Repo-Wide Git Stats (--all)
          BRANCHES_COUNT=$(git branch -r | grep -v '\->' | wc -l)
          TOTAL_COMMITS=$(git rev-list --count --all)
          CONTRIBUTORS_COUNT=$(git log --all --format='%ae' | sort -u | wc -l)
          echo "- **Total Branches in Repo:** $BRANCHES_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Commits (All Branches):** $TOTAL_COMMITS" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Contributors (All Branches):** $CONTRIBUTORS_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "**Contributors Breakdown (All Branches):**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git shortlog -sn --no-merges --all >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### Commit History Dates (All Branches)" >> $GITHUB_STEP_SUMMARY
          echo "**First 10 Commits (Oldest):**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git log --all --reverse --date=format:'%Y-%m-%d %H:%M' --format='%ad | %h | %an | %s' | head -n 10 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "**Last 10 Commits (Newest):**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git log --all -n 10 --date=format:'%Y-%m-%d %H:%M' --format='%ad | %h | %an | %s' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # 3. 3rd-Party SDKs & Asset Store Packages from LATEST_BRANCH
          echo "### 3rd-Party SDKs & Asset Store Packages (from $LATEST_BRANCH)" >> $GITHUB_STEP_SUMMARY
          MANIFEST_FILE=$(find . -maxdepth 4 -path "*/Packages/manifest.json" | head -n 1)
          if [ -n "$MANIFEST_FILE" ]; then
            echo "**UPM Packages (Excluding built-in Unity modules):**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            jq -r '.dependencies | to_entries[] | select(.key | startswith("com.unity.modules.") | not) | "\(.key): \(.value)"' "$MANIFEST_FILE" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          ASSETS_DIR=$(find . -maxdepth 3 -type d -name "Assets" | head -n 1)
          if [ -n "$ASSETS_DIR" ]; then
            echo "**Detected SDK & Asset Store Folders in Assets:**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            find "$ASSETS_DIR" -mindepth 1 -maxdepth 2 -type d ! -name "*_Game*" ! -name "Game" ! -iname "Scenes" ! -iname "Scripts" ! -iname "Prefabs" ! -iname "Materials" ! -iname "Textures" ! -iname "Models" ! -iname "Animations" ! -iname "Audio" ! -iname "Fonts" ! -iname "Resources" ! -iname "Settings" ! -iname "Editor" | sort >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          # 4. Lines of Code from LOC_BRANCH (Input Branch)
          git checkout "$LOC_BRANCH" --quiet
          echo "### Lines of Code (from $LOC_BRANCH)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cloc "${{ inputs.target_path }}" --force-lang=HLSL,compute --exclude-dir=node_modules,.git,dist,build | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY