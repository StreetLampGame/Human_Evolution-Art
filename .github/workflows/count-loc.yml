name: Count Lines of Code
run-name: "LOC: ${{ inputs.branch || github.ref_name }} (${{ inputs.target_path }})"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name to count (leave empty for default branch)'
        required: false
        type: string
      target_path:
        description: 'Folder path to count (leave as . for whole repo)'
        required: true
        default: '.'
        type: string

jobs:
  count-lines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Count lines with cloc
        run: |
          sudo apt-get update && sudo apt-get install -y cloc
          BRANCH_NAME="${{ inputs.branch || github.ref_name }}"
          echo "## Branch: **$BRANCH_NAME**" >> $GITHUB_STEP_SUMMARY
          echo "### Path: **${{ inputs.target_path }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cloc "${{ inputs.target_path }}" --force-lang=HLSL,compute --exclude-dir=node_modules,.git,dist,build | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
